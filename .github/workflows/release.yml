name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # The app links gtk 0.18 directly (Cargo.toml linux target deps) for the custom
          # header-bar menu and clipboard, so the full GTK3 dev stack must be installed
          # explicitly. Previously only webkit2gtk was installed and cargo failed at
          # gdk-sys: "Package gdk-3.0 was not found in the pkg-config search path".
          sudo apt-get install -y \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Render .desktop template for AppImage
        run: node render-desktop.js

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub runners have no /dev/fuse, so any AppImage we try to exec
          # (linuxdeploy, appimagetool) must self-extract instead of mounting.
          # The bundler runs both tools as `AppImage <args>`, which fails with
          # ENOENT/"failed to run linuxdeploy" without this variable. Setting
          # it in the environment covers every invocation, so no manual
          # download or wrapper script is needed anymore.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Ensure the (empty) frontend dist folder exists before bundling
          mkdir -p dist && touch dist/.gitkeep
          tauri build -vv 2>&1 | tee tauri-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          retention-days: 7

      - name: List bundle artifacts
        if: always()
        run: find target/release/bundle -type f | sort || true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the generated latest.json
          LATEST_JSON=$(find target/release/bundle -name "latest.json" | head -1)
          if [ -n "$LATEST_JSON" ]; then
            echo "Found latest.json at: $LATEST_JSON"
            gh release upload "${GITHUB_REF#refs/tags/}" "$LATEST_JSON" --clobber
          else
            echo "ERROR: latest.json not found! The updater will not work."
            echo "Make sure 'createUpdaterArtifacts' is true in tauri.conf.json"
            echo "and TAURI_SIGNING_PRIVATE_KEY is set in repository secrets."
            exit 1
          fi
