name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # The app links gtk 0.18 directly (Cargo.toml linux target deps) for the custom
          # header-bar menu and clipboard, so the full GTK3 dev stack must be installed
          # explicitly. Previously only webkit2gtk was installed and cargo failed at
          # gdk-sys: "Package gdk-3.0 was not found in the pkg-config search path".
          sudo apt-get install -y \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Render .desktop template for AppImage
        # qwen-studio.desktop is a Handlebars template ({{product_name}}, {{exec}}...)
        # consumed by the deb/rpm desktopTemplate machinery. The AppImage bundle
        # does NOT render it, so we materialize a concrete copy with the exact
        # values the bundler would substitute and inject it via
        # bundle.linux.appimage.files at usr/share/applications/qwen-studio.desktop
        # (the path linuxdeploy generates its own file at — ours overwrites it,
        # fixing the wrong-icon/wrong-Exec issues from v2.2.3..v2.2.5).
        run: |
          node render-desktop.js
          test -f qwen-studio.desktop.rendered || { echo "render step produced no output file"; exit 1; }
          cp qwen-studio.desktop.rendered qwen-studio.desktop
          grep -q '^Exec=qwen-studio$' qwen-studio.desktop || { echo "ERROR: rendered Exec line wrong"; cat qwen-studio.desktop; exit 1; }
          grep -q '^Icon=qwen-studio$' qwen-studio.desktop || { echo "ERROR: rendered Icon line wrong"; cat qwen-studio.desktop; exit 1; }
          cat qwen-studio.desktop

      - name: Build Tauri app (deb + rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Ensure the (empty) frontend dist folder exists before bundling
          mkdir -p dist && touch dist/.gitkeep
          # deb/rpm MUST keep the raw Handlebars template: the bundler renders
          # {{...}} placeholders itself. The rendered file is only for the
          # AppImage step below, so restore the template here to make the
          # order of steps irrelevant.
          git checkout -- qwen-studio.desktop
          tauri build --bundles deb,rpm -vv 2>&1 | tee tauri-build.log
          exit ${PIPESTATUS[0]}

      - name: Patch linuxdeploy-plugin-gtk.sh to copy Mesa EGL/GL into the bundle
        # Root cause of the grey screen (EGL_BAD_PARAMETER) and SIGSEGV in
        # v2.2.3..v2.2.5: the gtk plugin copies GTK/pixbuf libs but NEVER
        # libEGL.so.1/libGL.so.1, and bundleMediaFramework drags gstreamer
        # libs whose rpath resolves an old CUDA/NVIDIA stub on real hosts.
        # We append a block to the plugin script that linuxdeploy downloads
        # at build time (cached under ~/.cache/linuxdeploy): if the AppDir
        # ends up without libEGL.so.1, copy the system Mesa providers into
        # usr/lib. AppRun's LD_LIBRARY_PATH=$APPDIR/usr/lib then resolves
        # them for the main process AND all WebKitGTK GPU child processes.
        run: |
          set -euo pipefail
          PLUGIN=$(find "$HOME/.cache/linuxdeploy" -name 'linuxdeploy-plugin-gtk.sh' 2>/dev/null | head -1 || true)
          if [ -z "$PLUGIN" ]; then
            mkdir -p "$HOME/.cache/linuxdeploy"
            PLUGIN="$HOME/.cache/linuxdeploy/linuxdeploy-plugin-gtk.sh"
            curl -sSL -o "$PLUGIN" https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
            chmod +x "$PLUGIN"
          fi
          cat >> "$PLUGIN" <<'EOF'

          # --- qwen-studio CI patch: stage Mesa EGL/GL into the bundle ---
          if ! find "$APPDIR/usr" -name 'libEGL.so.1' 2>/dev/null | grep -q .; then
            echo "[gtk-plugin/qwen] staging system Mesa EGL/GL into $APPDIR/usr/lib"
            mkdir -p "$APPDIR/usr/lib"
            for n in libEGL.so.1 libGL.so.1; do
              for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib /usr/lib/mesa /usr/lib/mesa-libgl; do
                if [ -e "$d/$n" ]; then cp -L "$d/$n" "$APPDIR/usr/lib/" && break; fi
              done
            done
          fi
          EOF
          echo "Patched $PLUGIN:"; tail -15 "$PLUGIN"

      - name: Build Tauri app (AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub runners have no /dev/fuse, so any AppImage we try to exec
          # (linuxdeploy, appimagetool) must self-extract instead of mounting.
          # The bundler runs both tools as `AppImage <args>`, which fails with
          # ENOENT/"failed to run linuxdeploy" without this variable. Setting
          # it in the environment covers every invocation, so no manual
          # download or wrapper script is needed anymore.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # Build ONLY the AppImage here; deb/rpm were already produced by the
          # previous step. Re-running a full bundle would repackage everything
          # unnecessarily.
          args: --bundles appimage
        # NOTE: the "Render .desktop template for AppImage" step above has
        # already promoted qwen-studio.desktop.rendered over the template, so
        # bundle.linux.appimage.files injects a concrete, valid .desktop file.

      - name: Verify AppImage bundle integrity
        # Guards against shipping broken AppImages again (v2.2.3 SIGSEGV'd at
        # startup because the injected .desktop had a quoted Exec and the
        # bundle was missing libEGL.so.1). Fails the release early if either
        # regression reappears.
        run: |
          set -euo pipefail
          APPIMAGE=$(find target/release/bundle/appimage -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "No AppImage produced"; exit 1; }
          rm -rf /tmp/verify-appdir
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract >/dev/null
          cd squashfs-root && mv "$(pwd)" /tmp/verify-appdir && cd /
          ROOT=/tmp/verify-appdir
          DESKTOP_COUNT=$(find "$ROOT" -maxdepth 1 -name '*.desktop' | wc -l)
          echo "Desktop files in AppDir root: $DESKTOP_COUNT"
          [ "$DESKTOP_COUNT" -eq 1 ] || { echo "ERROR: expected exactly 1 .desktop file"; exit 1; }
          # linuxdeploy's generated root .desktop is intentionally left as-is;
          # the app's own entry lives under usr/share/applications/.
          ICON_NAME=$(grep '^Icon=' "$ROOT"/usr/share/applications/*.desktop | cut -d= -f2)
          echo "Icon key: $ICON_NAME"
          [ -n "$ICON_NAME" ] || { echo "ERROR: no Icon= key"; exit 1; }
          find "$ROOT/usr/share/icons" -name "$ICON_NAME.png" | grep -q . || { echo "ERROR: icon $ICON_NAME.png not installed in bundle"; exit 1; }
          BIN=$(find "$ROOT/usr/bin" -type f | head -1)
          if ldd "$BIN" 2>/dev/null | grep 'not found'; then
            echo "NOTE: unresolved libs above are expected for libEGL/libGL — src/lib.rs preloads the host Mesa copies at startup inside AppImages."
          fi
          # Hard gate: the gtk-plugin CI patch (and/or the staging hook in
          # src/lib.rs) must have bundled the Mesa EGL/GL providers. Without
          # them every non-Ubuntu host shows a grey screen (EGL_BAD_PARAMETER).
          find "$ROOT/usr/lib" -name 'libEGL.so.1' | grep -q . \
            || { echo "ERROR: libEGL.so.1 not staged into bundle"; exit 1; }
          find "$ROOT/usr/lib" -name 'libGL.so.1' | grep -q . \
            || { echo "ERROR: libGL.so.1 not staged into bundle"; exit 1; }
          echo "Mesa EGL/GL staged OK."
          echo "AppImage verification passed."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          retention-days: 7

      - name: List bundle artifacts
        if: always()
        run: find target/release/bundle -type f | sort || true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm.sig
          generate_release_notes: true
          # The updater artifacts (signatures + latest.json) are only produced
          # when TAURI_SIGNING_PRIVATE_KEY is configured in the repository
          # secrets. Until that key exists, a missing latest.json must not
          # fail an otherwise successful release.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json to release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('target/release/bundle/**/latest.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_JSON=$(find target/release/bundle -name "latest.json" | head -1)
          echo "Found latest.json at: $LATEST_JSON"
          gh release upload "${GITHUB_REF#refs/tags/}" "$LATEST_JSON" --clobber


  # ---------------------------------------------------------------------------
  # Arch Linux package (.pkg.tar.zst), built inside a real Arch container.
  # Links against the system webkit2gtk/mesa, so it needs none of the AppImage
  # workarounds: no missing-libEGL SIGSEGV, no EGL_BAD_PARAMETER grey screen,
  # and hicolor icons install cleanly from the deb-style data payload.
  # ---------------------------------------------------------------------------
  arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: Install build dependencies
        # NOTE: Arch has no `libxdo` package — the XDO library ships inside
        # `xdotool` (provides libxdo.so). v2.2.6 failed here with
        # "error: target not found: libxdo". `desktop-file-utils` is needed
        # because tauri-bundler runs update-desktop-database when bundling the
        # deb payload we reuse as the Arch rootfs.
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust pkgconf curl \
            webkit2gtk-4.1 gtk3 librsvg libayatana-appindicator \
            openssl xdotool patchelf zstd desktop-file-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace safe for git (root-owned container)
        run: git config --global --add safe.directory '*'
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri app (deb bundle -> reused as Arch payload)
        run: |
          mkdir -p dist && touch dist/.gitkeep
          npx tauri build --bundles deb > arch-build.log 2>&1 || { tail -100 arch-build.log; exit 1; }
          tail -20 arch-build.log
      - name: Package .pkg.tar.zst
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./tauri.conf.json').version)")
          DEB=$(find target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$DEB" || { echo "no deb produced"; exit 1; }
          rm -rf pkgroot && mkdir -p pkgroot
          dpkg-deb -x "$DEB" pkgroot
          # Drop Debian control metadata; we generate a native .PKGINFO instead.
          rm -rf pkgroot/DEBIAN
          SIZE_KB=$(du -sk pkgroot | cut -f1)
          printf '%s\n' \
            "# Generated by .github/workflows/release.yml" \
            "pkgname = qwen-studio" \
            "pkgbase = qwen-studio" \
            "pkgver = ${VERSION}-1" \
            "pkgdesc = Desktop client for Qwen" \
            "url = https://github.com/Thinkaboutmin/qwen-studio" \
            "builddate = $(date +%s)" \
            "packager = github-actions@users.noreply.github.com" \
            "size = ${SIZE_KB}" \
            "arch = x86_64" \
            "license = MIT" \
            "depend = webkit2gtk-4.1" \
            "depend = gtk3" \
            "depend = libayatana-appindicator" \
            "depend = nss" > pkgroot/.PKGINFO
          PKG="qwen-studio-${VERSION}-1-x86_64.pkg.tar.zst"
          if command -v zstd >/dev/null; then
            tar -cf - -C pkgroot . | zstd -q -T0 -19 -o "$PKG"
          else
            PKG="qwen-studio-${VERSION}-1-x86_64.pkg.tar.gz"
            tar -czf "$PKG" -C pkgroot .
          fi
          ls -la qwen-studio-*.pkg.tar*
          # Sanity: archive must contain binary, desktop file and icons.
          tar -tf "$PKG" | grep 'usr/bin/qwen-studio'
          tar -tf "$PKG" | grep 'usr/share/applications/qwen-studio.desktop'
          tar -tf "$PKG" | grep 'icons/hicolor' | head -3
          echo "Arch package ready."
      - name: Upload Arch package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qwen-studio-*.pkg.tar.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
