name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # The app links gtk 0.18 directly (Cargo.toml linux target deps) for the custom
          # header-bar menu and clipboard, so the full GTK3 dev stack must be installed
          # explicitly. Previously only webkit2gtk was installed and cargo failed at
          # gdk-sys: "Package gdk-3.0 was not found in the pkg-config search path".
          sudo apt-get install -y \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Render .desktop template for AppImage
        # qwen-studio.desktop is a Handlebars template ({{product_name}}, {{exec}}...)
        # consumed by the deb/rpm desktopTemplate machinery, which the bundler
        # renders itself. The AppImage path does NOT apply desktopTemplate —
        # linuxdeploy generates its own usr/share/applications/<productName>.desktop
        # with a quoted Exec and a wrong Icon (the SIGSEGV/grey-icon regressions of
        # v2.2.3..v2.2.6). We materialize a concrete copy here; it is injected via
        # bundle.linux.appimage.files at exactly linuxdeploy's output path so ours
        # overwrites theirs. The template file itself stays untouched in git so the
        # deb/rpm builds keep receiving the raw placeholders.
        run: |
          # Render the concrete desktop file used by bundle.linux.appimage.files.
          # v2.2.7/v2.2.8 failed because the map pointed at
          # "usr/share/applications/Qwen Studio.desktop" -> the SAME path where
          # linuxdeploy generates its own desktop file (quoted Exec, wrong Icon),
          # leaving TWO conflicting .desktop files in the bundle. The map now is
          # "usr/share/applications/qwen-studio.desktop" ->
          # "qwen-studio.desktop.rendered", so our correct file lands under a
          # distinct name and the generated one is removed by the verify step
          # (and AppRun resolves Exec=qwen-studio via usr/bin regardless of
          # which filename it reads).
          TARGET=$(node -e "const c=require('./tauri.conf.json');const m=c.bundle.linux.appimage.files||{};for(const k in m){console.log(m[k]);break}")
          test "$TARGET" = "qwen-studio.desktop.rendered" || { echo "ERROR: unexpected appimage.files source '$TARGET'"; exit 1; }
          node render-desktop.js
          grep -q '^Exec=qwen-studio$' qwen-studio.desktop.rendered || { echo "ERROR: rendered Exec line wrong"; cat qwen-studio.desktop.rendered; exit 1; }
          grep -q '^Icon=qwen-studio$' qwen-studio.desktop.rendered || { echo "ERROR: rendered Icon line wrong"; cat qwen-studio.desktop.rendered; exit 1; }
          cat qwen-studio.desktop.rendered

      - name: Build Tauri app (deb + rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Ensure the (empty) frontend dist folder exists before bundling
          mkdir -p dist && touch dist/.gitkeep
          # The global beforeBundleCommand (stage-mesa-libs.sh) also runs for
          # deb/rpm. Exporting APPDIR to a directory WITHOUT usr/bin makes the
          # hook detect "not an AppImage AppDir" and no-op cleanly.
          mkdir -p target/non-appdir
          APPDIR="$PWD/target/non-appdir" tauri build --bundles deb,rpm -vv 2>&1 | tee tauri-build.log
          exit ${PIPESTATUS[0]}

      - name: Build Tauri app (AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GitHub runners have no /dev/fuse, so any AppImage we try to exec
          # (linuxdeploy, appimagetool) must self-extract instead of mounting.
          # The bundler runs both tools as `AppImage <args>`, which fails with
          # ENOENT/"failed to run linuxdeploy" without this variable. Setting
          # it in the environment covers every invocation, so no manual
          # download or wrapper script is needed anymore.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # Build ONLY the AppImage here; deb/rpm were already produced by the
          # previous step. Re-running a full bundle would repackage everything
          # unnecessarily.
          args: --bundles appimage
        # NOTE: Mesa libEGL/libGL are staged into the AppDir by the
        # beforeBundleCommand hook (stage-mesa-libs.sh), which the bundler runs
        # from inside the AppDir right before invoking linuxdeploy.

      - name: Verify AppImage bundle integrity
        # Guards against shipping broken AppImages again. Checks:
        #  * our injected usr/share/applications/qwen-studio.desktop exists and
        #    carries the unquoted Exec=qwen-studio / Icon=qwen-studio (the
        #    v2.2.3..v2.2.8 regressions came from linuxdeploy's generated file);
        #  * if linuxdeploy ALSO left its <productName>.desktop behind, it is
        #    deleted here so the shipped AppDir ends up with exactly one entry;
        #  * the hicolor icon referenced by Icon= actually ships;
        #  * libEGL/libGL presence is only a NOTE now: src/lib.rs stages the
        #    host Mesa copies at runtime, so their absence must never block
        #    an otherwise-good release (soft check).
        run: |
          set -euo pipefail
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "No AppImage produced"; exit 1; }
          rm -rf /tmp/verify-appdir
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract >/dev/null
          mv squashfs-root /tmp/verify-appdir
          ROOT=/tmp/verify-appdir
          INJECTED="$ROOT/usr/share/applications/qwen-studio.desktop"
          test -f "$INJECTED" || { echo "ERROR: injected desktop file missing at $INJECTED"; find "$ROOT" -name '*.desktop'; exit 1; }
          grep -q '^Exec=qwen-studio$' "$INJECTED" || { echo "ERROR: bad Exec line:"; cat "$INJECTED"; exit 1; }
          grep -q '^Icon=qwen-studio$' "$INJECTED" || { echo "ERROR: bad Icon line:"; cat "$INJECTED"; exit 1; }
          # Remove any duplicate desktop entries generated elsewhere (linuxdeploy
          # canonical path, AppDir root leftovers) so only ours remains.
          find "$ROOT" -name '*.desktop' ! -path "$INJECTED" -print -delete || true
          mapfile -d '' ALL < <(find "$ROOT" -name '*.desktop' -print0)
          echo "Total .desktop files in bundle after cleanup: ${#ALL[@]}"
          [ "${#ALL[@]}" -eq 1 ] || { echo "ERROR: expected exactly 1 .desktop file:"; printf '%s\n' "${ALL[@]}"; exit 1; }
          find "$ROOT/usr/share/icons" -name 'qwen-studio.png' | grep -q . \
            || { echo "ERROR: icon qwen-studio.png not installed in bundle"; exit 1; }
          BIN=$(find "$ROOT/usr/bin" -type f | head -1)
          if ldd "$BIN" 2>/dev/null | grep 'not found'; then
            echo "NOTE: unresolved libEGL/libGL handled at runtime by src/lib.rs (stages host Mesa copies + relaunch)."
          fi
          if ! find "$ROOT/usr/lib" -name 'libEGL.so.1' | grep -q .; then
            echo "NOTE: libEGL.so.1 not staged at build time — runtime fallback in src/lib.rs will cover it."
          fi
          echo "AppImage verification passed."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          retention-days: 7

      - name: List bundle artifacts
        if: always()
        run: find target/release/bundle -type f | sort || true

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm.sig
          generate_release_notes: true
          # The updater artifacts (signatures + latest.json) are only produced
          # when TAURI_SIGNING_PRIVATE_KEY is configured in the repository
          # secrets. Until that key exists, a missing latest.json must not
          # fail an otherwise successful release.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json to release
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('target/release/bundle/**/latest.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_JSON=$(find target/release/bundle -name "latest.json" | head -1)
          echo "Found latest.json at: $LATEST_JSON"
          gh release upload "${GITHUB_REF#refs/tags/}" "$LATEST_JSON" --clobber


  # ---------------------------------------------------------------------------
  # Arch Linux package (.pkg.tar.zst), built inside a real Arch container.
  # Links against the system webkit2gtk/mesa, so it needs none of the AppImage
  # workarounds: no missing-libEGL SIGSEGV, no EGL_BAD_PARAMETER grey screen,
  # and hicolor icons install cleanly from the deb-style data payload.
  # ---------------------------------------------------------------------------
  arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: Install build dependencies
        # NOTE: Arch has no `libxdo` package — the XDO library ships inside
        # `xdotool` (provides libxdo.so). v2.2.6 failed here with
        # "error: target not found: libxdo". `desktop-file-utils` is needed
        # because tauri-bundler runs update-desktop-database when bundling the
        # deb payload we reuse as the Arch rootfs.
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust pkgconf curl \
            webkit2gtk-4.1 gtk3 librsvg libayatana-appindicator \
            openssl xdotool patchelf zstd desktop-file-utils dpkg
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark workspace safe for git (root-owned container)
        run: git config --global --add safe.directory '*'
      - name: Install npm dependencies
        run: npm ci
      - name: Build Tauri app (deb bundle -> reused as Arch payload)
        run: |
          mkdir -p dist && touch dist/.gitkeep
          npx tauri build --bundles deb > arch-build.log 2>&1 || { tail -100 arch-build.log; exit 1; }
          tail -20 arch-build.log
      - name: Package .pkg.tar.zst
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./tauri.conf.json').version)")
          DEB=$(find target/release/bundle/deb -name '*.deb' | head -1)
          test -n "$DEB" || { echo "no deb produced"; exit 1; }
          rm -rf pkgroot && mkdir -p pkgroot
          dpkg-deb -x "$DEB" pkgroot
          # Drop Debian control metadata; we generate a native .PKGINFO instead.
          rm -rf pkgroot/DEBIAN
          SIZE_KB=$(du -sk pkgroot | cut -f1)
          printf '%s\n' \
            "# Generated by .github/workflows/release.yml" \
            "pkgname = qwen-studio" \
            "pkgbase = qwen-studio" \
            "pkgver = ${VERSION}-1" \
            "pkgdesc = Desktop client for Qwen" \
            "url = https://github.com/Thinkaboutmin/qwen-studio" \
            "builddate = $(date +%s)" \
            "packager = github-actions@users.noreply.github.com" \
            "size = ${SIZE_KB}" \
            "arch = x86_64" \
            "license = MIT" \
            "depend = webkit2gtk-4.1" \
            "depend = gtk3" \
            "depend = libayatana-appindicator" \
            "depend = nss" > pkgroot/.PKGINFO
          PKG="qwen-studio-${VERSION}-1-x86_64.pkg.tar.zst"
          if command -v zstd >/dev/null; then
            tar -cf - -C pkgroot . | zstd -q -T0 -19 -o "$PKG"
          else
            PKG="qwen-studio-${VERSION}-1-x86_64.pkg.tar.gz"
            tar -czf "$PKG" -C pkgroot .
          fi
          ls -la qwen-studio-*.pkg.tar*
          # Sanity: archive must contain binary, desktop file and icons.
          # NOTE: the deb payload installs the desktop file under the product
          # name ("Qwen Studio.desktop") — v2.2.8 failed here because we grepped
          # for 'qwen-studio.desktop', which does not exist in the payload.
          tar -tf "$PKG" | grep 'usr/bin/qwen-studio'
          tar -tf "$PKG" | grep -F '.desktop'
          tar -tf "$PKG" | grep 'icons/hicolor' | head -3
          echo "Arch package ready."
      - name: Upload Arch package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: qwen-studio-*.pkg.tar.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
